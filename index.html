  <main class="max-w-7xl mx-auto w-full px-4 py-6 flex-1 flex flex-col gap-8">

        <div>
          <h2 class="text-sm uppercase tracking-wider text-slate-400 font-semibold">1. Sucessão Cronológica da Era Mesozoica</h2>
          <p class="text-xs text-slate-500">Cada período se conecta ao anterior e ao seguinte. Selecione uma época para abrir sua árvore evolutiva.</p>
        </div>
        <div class="flex items-center gap-2">
          <button id="prevPeriodBtn" onclick="navigatePeriod(-1)" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 transition disabled:opacity-30">
            ← Período Anterior
          </button>

            Próximo Período →
          </button>
        </div>
      </div>

      <!-- Nós dos Períodos Conectados -->
      <div class="relative grid grid-cols-1 md:grid-cols-3 gap-4 items-center" id="timelineContainer">
        <!-- Renderizado via JS -->
      </div>
    </section>

        </div>

        <div id="cladogramContainer" class="space-y-4">
          <!-- Renderizado via JS -->

      </section>

        </div>

    let activePeriodIndex = 0;
    let activeSpecies = mesozoicData[0].clades[0].species[0];
    let currentImageTab = "restoration"; // 'restoration' ou 'fossil'

    // Renderiza a Linha Cronológica Conectada
    function renderTimeline() {
      const container = document.getElementById("timelineContainer");
      container.innerHTML = mesozoicData.map((period, idx) => {
        const isActive = idx === activePeriodIndex;
        return `
          <div onclick="selectPeriod(${idx})" class="period-node cursor-pointer rounded-xl p-4 border bg-gradient-to-br ${period.color} ${isActive ? 'active ring-2 ring-amber-400' : 'opacity-70 hover:opacity-100 border-slate-800'} relative">
            <div class="flex items-center justify-between text-xs mb-1">
              <span class="font-bold uppercase tracking-wider ${period.badgeColor}">Fase 0${idx + 1}</span>
              <span class="text-slate-400">${period.timeRange}</span>
            </div>
            <h3 class="text-lg font-bold text-white">${period.name}</h3>
            <div class="mt-3 pt-2 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-400">
              <span>← Ant.: ${period.prev}</span>
              <span>Seg.: ${period.next} →</span>
            </div>
          </div>
        `;
      }).join("");

      document.getElementById("prevPeriodBtn").disabled = activePeriodIndex === 0;
      document.getElementById("nextPeriodBtn").disabled = activePeriodIndex === mesozoicData.length - 1;
    }

    function navigatePeriod(direction) {
      const nextIdx = activePeriodIndex + direction;
      if (nextIdx >= 0 && nextIdx < mesozoicData.length) {
        selectPeriod(nextIdx);
      }
    }

    function selectPeriod(index) {
      activePeriodIndex = index;
      const period = mesozoicData[index];
      activeSpecies = period.clades[0].species[0];
      renderTimeline();
      renderCladogram();
      renderSpeciesDetail();
    }

    // Renderiza a Árvore Taxonômica do Período Selecionado
    function renderCladogram() {
      const period = mesozoicData[activePeriodIndex];
      document.getElementById("currentPeriodBadge").textContent = `${period.name} (${period.timeRange})`;
      document.getElementById("treeSectionTitle").textContent = `Classificação Filogenética — ${period.name}`;
      document.getElementById("periodEnvSummary").textContent = period.environment;

      const container = document.getElementById("cladogramContainer");
      container.innerHTML = `
        <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-4">
          <div class="flex items-center gap-2 text-amber-400 font-bold text-sm mb-3">
            <span class="px-2 py-0.5 bg-amber-500/20 rounded border border-amber-500/40">Raiz</span>
            <span>Clado Dinosauria (${period.name})</span>
          </div>
          <div class="ml-3 pl-4 tree-line space-y-5">
            ${period.clades.map(clade => `
              <div class="relative">
                <div class="text-sm font-semibold text-slate-200 flex items-center gap-2">
                  <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                  <span>${clade.cladeName}</span>
                </div>
                <p class="text-xs text-slate-400 ml-4 mb-2">${clade.description}</p>
                <div class="ml-4 pl-4 tree-line grid grid-cols-1 sm:grid-cols-2 gap-2.5 mt-2">
                  ${clade.species.map(sp => {
                    const isSelected = activeSpecies.id === sp.id;
                    return `
                      <button onclick="selectSpecies('${sp.id}')" class="text-left p-3 rounded-xl border transition ${isSelected ? 'bg-amber-500/15 border-amber-500 text-white shadow-lg' : 'bg-slate-900/90 border-slate-800 text-slate-300 hover:border-slate-600'}">
                        <div class="text-xs text-amber-400 font-medium">${sp.diet} • ${sp.length}</div>
                        <div class="font-bold italic text-sm mt-0.5">${sp.name}</div>
                        <div class="text-[11px] text-slate-400 truncate mt-1">${sp.location}</div>
                      </button>
                    `;
                  }).join("")}
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function selectSpecies(speciesId) {
      const period = mesozoicData[activePeriodIndex];
      for (const clade of period.clades) {
        const found = clade.species.find(s => s.id === speciesId);
        if (found) {
          activeSpecies = found;
          break;
        }
      }
      renderCladogram();
      renderSpeciesDetail();
    }

    function switchImageTab(tab) {
      currentImageTab = tab;
      renderSpeciesDetail();

    // Busca imagens reais na API da Wikipedia (Reconstrução em Vida e Fóssil)
    async function fetchSpeciesImages(species) {
      if (mediaCache[species.id]) return mediaCache[species.id];

      let restorationUrl = "";
      let fossilUrl = "";

      try {
        const summaryRes = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(species.wikiTitle)}`);
        const summaryData = await summaryRes.json();
        if (summaryData.thumbnail && summaryData.thumbnail.source) {
          restorationUrl = summaryData.originalimage ? summaryData.originalimage.source : summaryData.thumbnail.source;
        }

        const mediaRes = await fetch(`https://en.wikipedia.org/api/rest_v1/page/media-list/${encodeURIComponent(species.wikiTitle)}`);
        const mediaData = await mediaRes.json();

        if (mediaData.items && mediaData.items.length > 0) {
          const images = mediaData.items.filter(item => item.type === "image" && item.srcset && item.srcset.length > 0);
          for (const img of images) {
            const titleLower = (img.title || "").toLowerCase();
            const captionLower = (img.caption && img.caption.text ? img.caption.text : "").toLowerCase();
            const combined = titleLower + " " + captionLower;
            const src = img.srcset[img.srcset.length - 1].src;
            const fullSrc = src.startsWith("//") ? "https:" + src : src;

            if (!fossilUrl && (combined.includes("skull") || combined.includes("skeleton") || combined.includes("fossil") || combined.includes("holotype") || combined.includes("mount") || combined.includes("bone"))) {
              if (fullSrc !== restorationUrl) fossilUrl = fullSrc;
            }
            if ((combined.includes("restoration") || combined.includes("reconstruction") || combined.includes("life") || combined.includes("ntamura") || combined.includes("paleoart")) && !restorationUrl) {
              restorationUrl = fullSrc;
            }
          }
          if (!fossilUrl && images.length > 1) {
            const secondSrc = images[1].srcset[images[1].srcset.length - 1].src;
            fossilUrl = secondSrc.startsWith("//") ? "https:" + secondSrc : secondSrc;
          }
        }
      } catch (e) {
        console.warn("Erro ao carregar mídia da Wikipedia:", e);
      }

      const result = {
        restoration: restorationUrl || "https://upload.wikimedia.org/wikipedia/commons/thumb/a/ac/No_image_available.svg/480px-No_image_available.svg.png",
        fossil: fossilUrl || restorationUrl
      };
      mediaCache[species.id] = result;
      return result;
    }

    async function renderSpeciesDetail() {

      const sp = activeSpecies;

      container.innerHTML = `
        <div class="animate-pulse text-xs text-amber-400 mb-2">Carregando registros visuais de ${sp.name}...</div>
      `;

      const images = await fetchSpeciesImages(sp);
      const displayImg = currentImageTab === "restoration" ? images.restoration : images.fossil;
      const captionText = currentImageTab === "restoration"
        ? `Ilustração / Reconstrução paleobiológica de ${sp.name}`
        : `Registro Fóssil / Esqueleto catalogado (${sp.fossilRecord})`;

      container.innerHTML = `
        <div>
          <div class="text-[11px] font-mono text-amber-400 mb-1">${sp.taxonomy}</div>
          <h3 class="text-2xl font-bold italic text-white">${sp.name}</h3>
          <p class="text-xs text-slate-400 mb-4">Significado: "${sp.meaning}"</p>

          <!-- Alternador: Reconstrução em Vida vs Fóssil Encontrado -->
          <div class="grid grid-cols-2 gap-2 p-1 bg-slate-950 rounded-xl border border-slate-800 mb-3">
            <button onclick="switchImageTab('restoration')" class="py-2 px-3 rounded-lg text-xs font-semibold transition ${currentImageTab === 'restoration' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}">
              🎨 Como Seria em Vida
            </button>
            <button onclick="switchImageTab('fossil')" class="py-2 px-3 rounded-lg text-xs font-semibold transition ${currentImageTab === 'fossil' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}">
              🦴 Fóssil Encontrado
            </button>
          </div>

          <!-- Visor de Imagem -->
          <div class="relative rounded-xl overflow-hidden bg-slate-950 border border-slate-800 flex flex-col items-center justify-center min-h-[220px] max-h-[280px] p-2">
            <img src="${displayImg}" alt="${sp.name}" class="max-h-[230px] w-auto object-contain rounded-lg" />
          </div>
          <p class="text-[11px] text-slate-400 mt-2 italic text-center">${captionText}</p>

          <!-- Metadados Biométricos -->
          <div class="grid grid-cols-3 gap-2 my-4 text-center">
            <div class="bg-slate-950/80 p-2.5 rounded-lg border border-slate-800">
              <span class="block text-[10px] uppercase text-slate-500">Dieta</span>
              <span class="text-xs font-bold text-slate-200">${sp.diet}</span>
            </div>
            <div class="bg-slate-950/80 p-2.5 rounded-lg border border-slate-800">
              <span class="block text-[10px] uppercase text-slate-500">Comprimento</span>
              <span class="text-xs font-bold text-slate-200">${sp.length}</span>
            </div>
            <div class="bg-slate-950/80 p-2.5 rounded-lg border border-slate-800">
              <span class="block text-[10px] uppercase text-slate-500">Massa Est.</span>
              <span class="text-xs font-bold text-slate-200">${sp.weight}</span>
            </div>
          </div>

          <!-- Características e Registro Fóssil -->
          <div class="space-y-3 text-xs leading-relaxed text-slate-300">
            <div class="bg-slate-950/50 p-3 rounded-lg border border-slate-800/80">
              <strong class="text-amber-400 block mb-1">📍 Ocorrência Geográfica e Estratigrafia:</strong>
              ${sp.location}
            </div>
            <div class="bg-slate-950/50 p-3 rounded-lg border border-slate-800/80">
              <strong class="text-amber-400 block mb-1">🔬 Características Morfológicas:</strong>
              ${sp.characteristics}
            </div>
            <div class="bg-slate-950/50 p-3 rounded-lg border border-slate-800/80">
              <strong class="text-amber-400 block mb-1">🦴 Documentação Fóssil:</strong>
              ${sp.fossilRecord}
            </div>
          </div>
        </div>
      `;
    }

    // Inicialização
    renderTimeline();
    renderCladogram();
    renderSpeciesDetail();
  </script>
</body>
</html>
